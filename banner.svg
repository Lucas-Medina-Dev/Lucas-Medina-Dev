<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#1F6FEB"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 58px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; letter-spacing: 1px; }
    .sub { font: 500 19px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #DCE7FF; letter-spacing: 3px; }
    .line { stroke: #FFFFFF; stroke-opacity: 0.5; stroke-width: 2; }
    .fade { animation: fade 1.2s ease-out both; }
    .fade2 { animation: fade 1.2s ease-out 0.5s both; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .w { animation: drift 7s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-80px); } }
  </style>
  <path d="M0 0 H1200 V185 C1000 235 800 150 600 190 C400 230 200 160 0 200 Z" fill="url(#bg)"/>
  <g class="w"><g transform="translate(0 14)">
    <path d="M0 175 C200 140 400 205 600 170 C800 135 1000 210 1280 165" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M0 155 C220 125 420 185 620 152 C820 120 1020 190 1280 148" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  </g></g>
  <text x="600" y="98" text-anchor="middle" class="title fade">Lucas Medina</text>
  <line x1="560" y1="118" x2="640" y2="118" class="line fade2"/>
  <text x="600" y="146" text-anchor="middle" class="sub fade2">FINANCE · M&amp;A · PRIVATE EQUITY · VENTURE CAPITAL</text>
</svg>
